jwt:
secret: ${JWT_SECRET}
spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  datasource:
    url: ${DB_URL}
    username: postgres
    password: your_password
    driver-class-name: org.postgresql.Driver
  application:
    name: ticketNestBackend


